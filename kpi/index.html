<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绩效考核系统 · Performance Appraisal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#102A4C; --navy-d:#0B1E38; --navy-l:#1C3A63;
  --gold:#C9A24B; --gold-d:#A8842F; --gold-soft:#EFE3C4;
  --ivory:#F6F4EF; --card:#FFFFFF; --slate:#243042; --muted:#7A8290;
  --line:#E7E3D8; --line-2:#EFEDE5;
  --green:#2E7D5B; --green-bg:#E5F1EB;
  --amber:#C8862A; --amber-bg:#FBF0DE;
  --red:#B3433B; --red-bg:#F8E7E5;
  --blue:#2F5C9E; --blue-bg:#E7EEF7;
  --shadow:0 1px 2px rgba(16,42,76,.06),0 8px 24px rgba(16,42,76,.07);
  --shadow-lg:0 12px 48px rgba(11,30,56,.18);
  --r:14px; --r-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Noto Sans SC","Inter",system-ui,sans-serif;
  background:var(--ivory); color:var(--slate);
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.5;
}
h1,h2,h3,h4,.serif{font-family:"Noto Serif SC",serif}
.num{font-family:"Inter",sans-serif;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cfd4dc;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 70% -10%,#1C3A63 0%,var(--navy) 45%,var(--navy-d) 100%);padding:20px;z-index:100}
.login-card{width:100%;max-width:410px;background:var(--card);border-radius:18px;
  box-shadow:var(--shadow-lg);overflow:hidden}
.login-head{background:linear-gradient(160deg,var(--navy-l),var(--navy));padding:38px 34px 30px;color:#fff;position:relative}
.login-head::after{content:"";position:absolute;left:34px;bottom:22px;width:46px;height:3px;background:var(--gold)}
.login-badge{font-family:"Inter";font-size:11px;letter-spacing:3px;color:var(--gold-soft);text-transform:uppercase}
.login-head h1{font-size:25px;font-weight:700;margin-top:9px;letter-spacing:1px}
.login-head p{color:#A9BBD4;font-size:12.5px;margin-top:7px}
.login-body{padding:30px 34px 34px}
.login-body label{display:block;font-size:12px;color:var(--muted);margin:0 0 7px;font-weight:500}
.login-body .field{margin-bottom:18px}
.login-body input,.login-body select{width:100%;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:var(--r-sm);background:#fbfaf7;transition:.15s}
.login-body input:focus,.login-body select:focus{outline:none;border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(201,162,75,.15)}
.btn-login{width:100%;padding:13px;background:var(--navy);color:#fff;border-radius:var(--r-sm);
  font-weight:600;font-size:15px;letter-spacing:1px;transition:.15s;margin-top:4px}
.btn-login:hover{background:var(--navy-d)}
.login-err{color:var(--red);font-size:12.5px;margin-top:12px;text-align:center;min-height:16px}
.login-hint{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted);line-height:1.7}
.login-hint b{color:var(--slate)}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--navy);color:#cdd8e8;flex-shrink:0;
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:transform .25s}
.sb-brand{padding:22px 22px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-brand .badge{font-family:"Inter";font-size:10px;letter-spacing:2.5px;color:var(--gold)}
.sb-brand h2{color:#fff;font-size:17px;font-weight:700;margin-top:5px;letter-spacing:.5px}
.sb-nav{flex:1;overflow-y:auto;padding:12px 12px 20px}
.sb-group{font-size:10.5px;letter-spacing:1.5px;color:#6f86a8;text-transform:uppercase;padding:14px 12px 7px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;
  color:#bccadc;font-size:13.5px;font-weight:500;cursor:pointer;transition:.13s;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.on{background:var(--gold);color:var(--navy-d);font-weight:700}
.nav-item .ic{width:18px;height:18px;flex-shrink:0;stroke-width:1.9}
.nav-item.on .ic{stroke:var(--navy-d)}
.sb-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7d92b3}

.main{flex:1;margin-left:248px;display:flex;flex-direction:column;min-width:0}
.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:14px;padding:0 24px;position:sticky;top:0;z-index:30}
.menu-btn{display:none;font-size:22px;color:var(--navy)}
.topbar .pagetitle{font-family:"Noto Serif SC";font-size:18px;font-weight:600;color:var(--navy)}
.topbar .spacer{flex:1}
.cycle-pick{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--ivory);
  border:1px solid var(--line);border-radius:9px;font-size:12.5px;color:var(--slate)}
.cycle-pick select{border:none;background:none;font-weight:600;color:var(--navy);cursor:pointer;max-width:160px}
.cycle-pick select:focus{outline:none}
.user-chip{display:flex;align-items:center;gap:10px;cursor:pointer}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(140deg,var(--gold),var(--gold-d));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.user-chip .un{font-size:13px;font-weight:600;line-height:1.2}
.user-chip .ur{font-size:11px;color:var(--muted)}
.content{padding:26px 28px 60px;max-width:1240px;width:100%}

/* ---------- COMPONENTS ---------- */
.row{display:flex;gap:16px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:20px 22px}
.card h3{font-size:15px;color:var(--navy);margin-bottom:3px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.section-head .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.eyebrow{font-family:"Inter";font-size:11px;letter-spacing:2px;color:var(--gold-d);text-transform:uppercase;font-weight:600}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;font-size:13px;
  font-weight:600;transition:.13s;border:1.5px solid transparent;white-space:nowrap}
.btn .ic{width:16px;height:16px;stroke-width:2}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy-d)}
.btn-gold{background:var(--gold);color:var(--navy-d)}.btn-gold:hover{background:var(--gold-d);color:#fff}
.btn-ghost{background:#fff;color:var(--slate);border-color:var(--line)}.btn-ghost:hover{border-color:var(--gold);color:var(--navy)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-danger{background:var(--red-bg);color:var(--red)}.btn-danger:hover{background:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:500}
.stat .val{font-family:"Inter";font-size:30px;font-weight:700;color:var(--navy);margin-top:6px;line-height:1}
.stat .val small{font-size:14px;color:var(--muted);font-weight:500}
.stat .delta{font-size:11.5px;margin-top:7px;color:var(--green);font-weight:600}

table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11.5px;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;
  font-weight:600;padding:11px 14px;border-bottom:1.5px solid var(--line);white-space:nowrap}
tbody td{padding:13px 14px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fbfaf6}
.t-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}

.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
.tag-gray{background:#eef0f3;color:#5c6675}
.tag-blue{background:var(--blue-bg);color:var(--blue)}
.tag-green{background:var(--green-bg);color:var(--green)}
.tag-amber{background:var(--amber-bg);color:var(--amber)}
.tag-red{background:var(--red-bg);color:var(--red)}
.tag-gold{background:var(--gold-soft);color:var(--gold-d)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}

.grade-pill{font-family:"Inter";font-weight:800;font-size:13px;width:30px;height:30px;border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center}
.g-S{background:#3b2f6e;color:#fff}.g-A{background:var(--green);color:#fff}
.g-B{background:var(--blue);color:#fff}.g-C{background:var(--amber);color:#fff}.g-D{background:var(--red);color:#fff}

.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .ic{width:42px;height:42px;stroke:var(--line);stroke-width:1.5;margin-bottom:12px}
.empty p{font-size:14px;font-weight:500;color:var(--slate)}.empty span{font-size:12.5px}

/* progress / pipeline */
.pipe{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.pipe-step{display:flex;align-items:center;gap:8px}
.pipe-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;background:#eef0f3;color:#9aa3b0;border:2px solid transparent}
.pipe-step.done .pipe-dot{background:var(--green);color:#fff}
.pipe-step.active .pipe-dot{background:var(--gold);color:var(--navy-d);box-shadow:0 0 0 4px rgba(201,162,75,.18)}
.pipe-step .lab{font-size:12px;color:var(--muted);font-weight:500}
.pipe-step.done .lab,.pipe-step.active .lab{color:var(--slate);font-weight:600}
.pipe-line{width:34px;height:2px;background:var(--line);margin:0 4px}
.pipe-step.done + .pipe-line{background:var(--green)}

/* progress bar */
.bar{height:7px;background:#eef0f3;border-radius:6px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:6px;background:var(--gold);transition:width .5s}

/* score ring */
.ring-wrap{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:128px;height:128px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ctr .sc{font-family:"Inter";font-size:30px;font-weight:800;color:var(--navy);line-height:1}
.ring .ctr .lb{font-size:10.5px;color:var(--muted);letter-spacing:1px;margin-top:3px}

/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fg{display:flex;flex-direction:column;gap:6px}
.fg.full{grid-column:1/-1}
.fg label{font-size:12px;color:var(--muted);font-weight:600}
.fg input,.fg select,.fg textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fbfaf7;transition:.15s;width:100%}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(201,162,75,.13)}
.fg textarea{resize:vertical;min-height:70px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(11,30,56,.45);display:none;align-items:flex-start;justify-content:center;
  z-index:80;padding:30px 16px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:var(--shadow-lg);animation:pop .2s}
.modal.wide{max-width:880px}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:17px;color:var(--navy)}
.modal-head .x{font-size:22px;color:var(--muted);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.modal-head .x:hover{background:var(--ivory);color:var(--slate)}
.modal-body{padding:22px 24px;max-height:66vh;overflow-y:auto}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#fbfaf7;border-radius:0 0 16px 16px}

/* rating */
.rate{display:flex;gap:6px}
.rate button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:700;
  font-family:"Inter";color:var(--muted);transition:.12s}
.rate button:hover{border-color:var(--gold)}
.rate button.on{background:var(--gold);border-color:var(--gold);color:var(--navy-d)}
.score-line{display:grid;grid-template-columns:1.3fr 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line-2)}
.score-line:last-child{border-bottom:none}
.score-line .nm{font-size:13.5px;font-weight:600;color:var(--slate)}
.score-line .desc{font-size:11.5px;color:var(--muted);margin-top:2px}

/* chart */
.chart-bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:10px}
.cb{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.cb .bar-v{width:100%;max-width:46px;background:linear-gradient(180deg,var(--navy-l),var(--navy));border-radius:7px 7px 0 0;
  position:relative;transition:height .6s;min-height:4px}
.cb .bar-v span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-family:"Inter";font-size:12px;font-weight:700;color:var(--navy)}
.cb .cb-lab{font-size:11.5px;color:var(--muted);text-align:center}
.dist-row{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.dist-row .gl{width:26px}.dist-row .db{flex:1}.dist-row .dn{width:40px;text-align:right;font-family:"Inter";font-weight:700;font-size:13px}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy-d);color:#fff;
  padding:12px 22px;border-radius:10px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;
  transition:.25s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}

.muted{color:var(--muted)}.mono{font-family:"Inter"}
.mb0{margin-bottom:0}.mt16{margin-top:16px}.mt24{margin-top:24px}
.flex{display:flex}.between{justify-content:space-between}.aic{align-items:center}.gap8{gap:8px}.gap12{gap:12px}
.right{text-align:right}.center{text-align:center}.w100{width:100%}
.hide{display:none!important}

@media(max-width:980px){
  .form-grid{grid-template-columns:1fr}
}
@media(max-width:860px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  .main{margin-left:0}
  .menu-btn{display:block}
  .content{padding:18px 16px 60px}
  .topbar{padding:0 16px}
  .cycle-pick .lbx{display:none}
  .user-chip .uinfo{display:none}
  .sb-backdrop{position:fixed;inset:0;background:rgba(11,30,56,.4);z-index:35;display:none}
  .sb-backdrop.show{display:block}
}
/* ===== V2: 9-BOX ===== */
.ninebox{display:grid;grid-template-columns:auto repeat(3,1fr);grid-template-rows:auto repeat(3,1fr);gap:8px}
.nb-axis-x{grid-column:2/5;text-align:center;font-size:12px;font-weight:700;color:var(--navy);letter-spacing:2px;padding-top:6px}
.nb-corner{}
.nb-ylab{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);font-weight:600;writing-mode:vertical-rl;transform:rotate(180deg)}
.nb-cell{border-radius:12px;padding:11px;min-height:118px;border:1.5px solid var(--line);position:relative;transition:.15s}
.nb-cell .cell-t{font-size:11.5px;font-weight:700;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.nb-cell .cell-n{font-size:10px;color:var(--muted);font-weight:600;background:#fff;border-radius:20px;padding:1px 7px}
.nb-chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 9px 3px 4px;font-size:11.5px;font-weight:600;margin:0 4px 4px 0;cursor:pointer;box-shadow:0 1px 2px rgba(16,42,76,.06)}
.nb-chip:hover{border-color:var(--gold)}
.nb-chip .av{width:18px;height:18px;border-radius:50%;background:var(--navy);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;font-family:"Inter"}
.nb-star{background:#efe9fb;border-color:#d9cdf2}.nb-good{background:var(--green-bg);border-color:#cfe6da}
.nb-core{background:#fffaf0;border-color:#f0e4c8}.nb-watch{background:var(--amber-bg);border-color:#f2e2c4}
.nb-risk{background:var(--red-bg);border-color:#f0d4d1}.nb-pro{background:var(--blue-bg);border-color:#cfdcef}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;font-size:12px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;margin-right:6px;vertical-align:-1px}
/* ===== V2: OKR ===== */
.okr-node{border:1.5px solid var(--line);border-radius:12px;background:#fff;margin-bottom:12px;overflow:hidden}
.okr-head{padding:14px 16px;display:flex;align-items:center;gap:12px}
.okr-head .ot{flex:1;min-width:0}.okr-head .ot .lvl{font-size:10.5px;letter-spacing:1px;font-weight:700;text-transform:uppercase}
.okr-head .ot h4{font-size:14.5px;color:var(--slate);margin-top:3px}
.okr-head .op{width:120px;flex-shrink:0}
.lvl-company{color:#3b2f6e}.lvl-dept{color:var(--blue)}.lvl-individual{color:var(--gold-d)}
.okr-bar-l{border-left:3px solid var(--gold)}
.kr{padding:10px 16px;border-top:1px dashed var(--line-2);display:flex;align-items:center;gap:12px;font-size:13px}
.kr .krn{flex:1}.kr .krp{width:150px;display:flex;align-items:center;gap:8px}.kr input[type=range]{width:100%}
.okr-children{padding:0 0 4px 12px;border-left:2px solid var(--line-2);margin:0 0 6px 22px}
/* ===== V2: 360 ===== */
.gap-row{display:grid;grid-template-columns:96px 1fr 46px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
.gap-row .gname{font-weight:600}
.minibar{height:9px;background:#eef0f3;border-radius:6px;position:relative}
.minibar i{position:absolute;left:0;top:0;height:100%;border-radius:6px;background:var(--gold)}
.minibar .mk{position:absolute;top:-3px;width:3px;height:15px;background:var(--navy-d);border-radius:2px}
.rel-tab{padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:600;background:#eef0f3;color:#5c6675;display:inline-block;margin:0 6px 6px 0}
/* ===== V2: Kudos ===== */
.kudo{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.kudo .kic{width:38px;height:38px;border-radius:10px;background:var(--gold-soft);color:var(--gold-d);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kudo .kic svg{width:19px;height:19px}
.kudo .kb{flex:1}.kudo .kmeta{font-size:12.5px}.kudo .kmeta b{color:var(--navy)}
.kudo .kmsg{font-size:13.5px;margin-top:4px;color:var(--slate)}
.kudo .kt{font-size:11px;color:var(--muted);white-space:nowrap}
/* ===== V2: check-in ===== */
.mood{display:flex;gap:7px}
.mood button{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:20px}
.mood button.on{border-color:var(--gold);background:var(--gold-soft)}
.ci-card{border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:12px;background:#fff}
.ci-card .ci-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
/* ===== V2: AI assistant ===== */
.ai-fab{position:fixed;right:24px;bottom:24px;z-index:60;display:flex;align-items:center;gap:9px;padding:13px 20px;border-radius:30px;background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 28px rgba(168,132,47,.45);transition:.15s}
.ai-fab:hover{transform:translateY(-2px)}.ai-fab svg{width:19px;height:19px}
.ai-panel{position:fixed;right:0;top:0;bottom:0;width:420px;max-width:92vw;background:#fff;z-index:90;box-shadow:-12px 0 48px rgba(11,30,56,.2);display:none;flex-direction:column;transform:translateX(100%);transition:transform .28s}
.ai-panel.open{display:flex;transform:none}
.ai-head{padding:18px 20px;background:linear-gradient(135deg,var(--navy),var(--navy-l));color:#fff;display:flex;align-items:center;gap:10px}
.ai-head .at{flex:1}.ai-head .at .ab{font-size:10.5px;letter-spacing:2px;color:var(--gold-soft);font-weight:700}
.ai-head .at h3{color:#fff;font-size:16px;margin-top:3px}
.ai-head .x{color:#cdd8e8;font-size:24px;cursor:pointer}
.ai-msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--ivory)}
.ai-msg{max-width:88%;padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.ai-msg.u{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.ai-msg.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.ai-sugg{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px 12px;background:var(--ivory)}
.ai-sugg button{font-size:12px;padding:7px 12px;border-radius:18px;background:#fff;border:1px solid var(--line);color:var(--slate)}
.ai-sugg button:hover{border-color:var(--gold);color:var(--navy)}
.ai-input{padding:14px 16px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:flex-end;background:#fff}
.ai-input textarea{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:none;max-height:90px;background:#fbfaf7}
.ai-input textarea:focus{outline:none;border-color:var(--gold)}
.ai-send{width:42px;height:42px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-send:disabled{opacity:.4}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;animation:bd 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bd{0%,60%,100%{opacity:.3}30%{opacity:1}}
.btn-ai{background:var(--gold-soft);color:var(--gold-d);font-size:12px;padding:6px 11px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.btn-ai svg{width:14px;height:14px}.btn-ai:hover{background:var(--gold);color:#fff}
@media(max-width:560px){.ai-fab{right:16px;bottom:16px;padding:11px 16px}}

/* ----------- 评分引擎 ----------- */
function calcKPI(a){ // 加权达成分 → 0~100
  let tot=0,w=0; a.kpi.forEach(it=>{tot+=(num(it.mgr))*it.weight; w+=it.weight;});
  return w? +(tot/w).toFixed(1):0;
}
function calcComp(a){ const v=Object.values(a.comp).map(x=>num(x.mgr)); return scale5(v); }
function calcAtt(a){ const v=Object.values(a.att).map(x=>num(x.mgr)); return scale5(v); }
function scale5(arr){ if(!arr.length)return 0; const avg=arr.reduce((s,x)=>s+x,0)/arr.length; return +((avg/5)*100).toFixed(1); }
function num(x){ x=parseFloat(x); return isNaN(x)?0:x; }
function totalScore(a,cy){
  const w=cy.weights; const k=calcKPI(a),c=calcComp(a),t=calcAtt(a);
  return +((k*w.kpi + c*w.comp + t*w.att)/100).toFixed(1);
}
function gradeFor(score){
  const g=DB.settings.grades.find(x=>score>=x.min)||DB.settings.grades[DB.settings.grades.length-1];
  return g;
}
function finalize(a,cy){
  a.totalScore=totalScore(a,cy);
  const g=gradeFor(a.totalScore);
  a.grade=g.g; a.salaryAdj=g.adj; a.bonus=g.bonus; a.recommend=a.recommend||g.note;
}

function scoreRing(score){const p=Math.min(score,100),r=54,c2=2*Math.PI*r,off=c2*(1-p/100);
  return `<div class="ring"><svg width="128" height="128">
    <circle cx="64" cy="64" r="${r}" fill="none" stroke="#eef0f3" stroke-width="12"/>
    <circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--gold)" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${c2}" stroke-dashoffset="${off}"/></svg>
    <div class="ctr"><div class="sc">${score}</div><div class="lb">综合得分</div></div></div>`;}
function breakdownBars(a,cy){
  const k=calcKPI(a),cp=calcComp(a),at=calcAtt(a);
  const rows=[['KPI 业绩',k,cy.weights.kpi,'var(--navy)'],['工作能力',cp,cy.weights.comp,'var(--gold)'],['工作态度',at,cy.weights.att,'var(--green)']];
  return rows.map(([n,v,w,col])=>`<div style="margin-bottom:12px">
    <div class="flex between" style="font-size:12.5px;margin-bottom:5px"><span style="font-weight:600">${n} <span class="muted">·${w}%</span></span><span class="num" style="font-weight:700">${v}</span></div>
    <div class="bar"><i style="width:${v}%;background:${col}"></i></div></div>`).join('');
}
function statusTag(s){const x=STATUS[s];return `<span class="tag ${x.cls}">${x.t}</span>`}
function pipeHTML(s){
  const steps=['填写自评','主管评分','HR复核','完成'];const cur=STATUS[s].step;
  let h='<div class="pipe">';
  steps.forEach((st,i)=>{
    const cls=i<cur?'done':i===cur?'active':'';
    h+=`<div class="pipe-step ${cls}"><div class="pipe-dot">${i<cur?'✓':i+1}</div><span class="lab">${st}</span></div>`;
    if(i<steps.length-1)h+='<div class="pipe-line"></div>';
  });
  return h+'</div>';
}

  modal(id?'编辑 KPI 模板':'新增 KPI 模板',`
    <div class="form-grid">
      <div class="fg"><label>模板名称</label><input id="tp_name" value="${esc(t.name)}" placeholder="例:销售岗位 KPI"></div>
      <div class="fg"><label>适用部门</label><select id="tp_dept">${DB.departments.map(d=>`<option value="${d.id}" ${d.id===t.dept?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>
    </div>
    <div style="margin-top:18px"><div class="flex between aic"><label style="font-size:12px;color:var(--muted);font-weight:600">KPI 指标项 (权重总和需 = 100%)</label>

      <div id="tplItems" style="margin-top:10px"></div>

    </div>`,
    ()=>{
      collectTplItems();
      const sum=TPL_ITEMS.reduce((s,i)=>s+(+i.weight||0),0);
      if(sum!==100){toast('权重总和必须等于 100%','err');return false;}

      if(id){Object.assign(t,o);}else{DB.templates.push({id:uid('t'),...o});}
      save();renderView('templates');toast('已保存','ok');
    });

}
function renderTplItems(){

  el.innerHTML=TPL_ITEMS.map((it,i)=>`<div class="flex gap8" style="margin-bottom:8px;align-items:flex-start">

    <input type="number" style="width:74px;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:#fbfaf7" placeholder="%" value="${it.weight}" oninput="TPL_ITEMS[${i}].weight=+this.value;tplSum()">

}
function addTplItem(){collectTplItems();TPL_ITEMS.push({name:'',target:'',weight:0});renderTplItems();}

function tplSum(){const el=document.getElementById('tplSum');if(el){const s=TPL_ITEMS.reduce((a,i)=>a+(+i.weight||0),0);el.textContent=s;el.style.color=s===100?'var(--green)':'var(--red)';}}

function withSelf(a){return {...a,kpi:a.kpi.map(it=>({...it,mgr:it.self})),
  comp:Object.fromEntries(Object.entries(a.comp).map(([k,v])=>[k,{mgr:v.self}])),
  att:Object.fromEntries(Object.entries(a.att).map(([k,v])=>[k,{mgr:v.self}]))};}
function dimBlock(title,weight,key,a,mode,showMgr,which){
  const items=Object.keys(a[key]);
  const sc=which==='comp'?calcComp(showMgr?a:withSelf(a)):calcAtt(showMgr?a:withSelf(a));
  return `<div class="card card-pad mt16"><div class="flex between aic" style="margin-bottom:6px">
    <h3>${title} <span class="muted" style="font-size:12px">权重 ${weight}%</span></h3>

    ${items.map(nm=>`<div class="score-line">
      <div class="nm">${esc(nm)}</div>
      <div>${mode==='self'?rateUI(key,nm,'self',a[key][nm].self):`<div class="muted" style="font-size:12px">自评 ${a[key][nm].self||'—'} 分</div>`}
        ${showMgr&&mode==='manager'?'<div style="margin-top:6px">'+rateUI(key,nm,'mgr',a[key][nm].mgr)+'</div>':showMgr?`<div class="muted" style="font-size:12px;margin-top:4px">主管 ${a[key][nm].mgr||'—'} 分</div>`:''}
      </div>
      <div class="num right" style="font-weight:700;min-width:30px">${showMgr?(a[key][nm].mgr||'—'):(a[key][nm].self||'—')}</div>
    </div>`).join('')}
  </div>`;
}
function rateUI(key,nm,who,cur){
  let h=`<div class="rate">`;
  for(let i=1;i<=5;i++) h+=`<button class="${cur==i?'on':''}" onclick="setRate('${key}','${esc(nm).replace(/'/g,"")}','${who}',${i},this)">${i}</button>`;
  return h+'</div>';
}
function setRate(key,nm,who,v,btn){
  CURA[key][nm][who]=v;
  btn.parentElement.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i+1===v));
  recalc();
}
function recalc(){
  const showMgr=MODE!=='self'&&CURA.status!=='self';
  const a=showMgr?CURA:withSelf(CURA);
  const cy=cycleById(CURA.cycleId);
  const sc=totalScore(a,cy);const g=gradeFor(sc);
  const ls=document.getElementById('liveScore');if(ls)ls.textContent=sc;
  const lg=document.getElementById('liveGrade');
  if(lg)lg.innerHTML=`<div style="text-align:center"><div class="grade-pill g-${g.g}" style="width:50px;height:50px;font-size:22px;border-radius:12px">${g.g}</div>
    <div style="font-size:12px;margin-top:6px;color:var(--gold-soft)">${g.label} · +${g.adj}%</div></div>`;
}
function submitAppraisal(mode){
  const a=CURA,cy=cycleById(a.cycleId);
  if(mode==='self'){
    if(a.kpi.some(it=>!it.self)||Object.values(a.comp).some(v=>!v.self)||Object.values(a.att).some(v=>!v.self)){
      toast('请完成所有自评项目','err');return false;}
    a.status='manager';save();closeModal();toast('自评已提交,等待主管评分','ok');renderView(CUR);return;
  }
  if(mode==='manager'){
    if(a.kpi.some(it=>!it.mgr)||Object.values(a.comp).some(v=>!v.mgr)||Object.values(a.att).some(v=>!v.mgr)){
      toast('请完成所有主管评分项目','err');return false;}
    a.status='hr';save();closeModal();toast('主管评分已提交,等待 HR 复核','ok');renderView(CUR);return;
  }
  if(mode==='hr'){
    a.status='done';finalize(a,cy);save();closeModal();toast('考核已完成 ✓','ok');renderView(CUR);return;
  }
}

/* ========== 生成考核表 ========== */
function ensureAppraisals(){
  const list=DB.employees.filter(e=>e.status==='在职');
  let made=0;
  list.forEach(e=>{
    if(appraisalOf(e.id,CYCLE.id))return;
    const tpl=DB.templates.find(t=>t.dept===e.dept)||DB.templates[0];
    const kpi=(tpl?tpl.items:[{name:'工作目标',target:'达成岗位目标',weight:100}]).map(it=>({name:it.name,target:it.target,weight:it.weight,self:0,mgr:0}));
    const comp={},att={};
    DB.settings.comp.forEach(n=>comp[n]={self:0,mgr:0});
    DB.settings.att.forEach(n=>att[n]={self:0,mgr:0});
    DB.appraisals.push({id:uid('a'),cycleId:CYCLE.id,empId:e.id,status:'self',kpi,comp,att,selfComment:'',mgrComment:'',hrComment:''});
    made++;
  });
  save();renderView(CUR);
  toast(made?`已生成 ${made} 份考核表`:'所有员工已有考核表','ok');
}

/* ========== CSV 导出 ========== */
function exportCSV(){
  const aps=DB.appraisals.filter(a=>a.cycleId===CYCLE.id&&a.status==='done');
  if(!aps.length){toast('尚无完成的考核可导出','err');return;}
  const rows=[['工号','姓名','部门','职位','KPI得分','能力得分','态度得分','综合得分','等级','调薪%','奖金系数','发展建议']];
  aps.forEach(a=>{const e=empById(a.empId);
    rows.push([e.no,e.name,deptName(e.dept),e.pos,calcKPI(a),calcComp(a),calcAtt(a),a.totalScore,a.grade,a.salaryAdj,a.bonus,a.recommend]);});
  const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${(''+c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`绩效考核_${CYCLE.name}.csv`;a.click();URL.revokeObjectURL(url);
  toast('CSV 已导出','ok');
}

/* ---------- 共用:取员工最新综合得分 ---------- */
function latestScore(empId){
  const done=DB.appraisals.filter(a=>a.empId===empId&&a.status==='done');
  if(!done.length)return null;
  // 优先当前周期,否则最近
  const cur=done.find(a=>a.cycleId===CYCLE.id);
  return (cur||done[done.length-1]).totalScore;
}
function perfBand(empId){const s=latestScore(empId);if(s==null)return null;return s>=80?2:s>=65?1:0;} // 0低1中2高
function potBand(empId){const p=DB.potential[empId]||2;return p-1;} // 0低1中2高

function objProgress(o){return o.krs.length?Math.round(o.krs.reduce((s,k)=>s+(+k.progress||0),0)/o.krs.length):0;}
function objOwnerName(o){return o.type==='company'?'全公司':o.type==='dept'?deptName(o.ownerId):(empById(o.ownerId)?.name||'—');}
function viewOKR(c){

/* ========== 校准会议 Calibration ========== */
function viewCalibration(c){
  const done=DB.appraisals.filter(a=>a.cycleId===CYCLE.id&&a.status==='done');
  const dist={};DB.settings.grades.forEach(g=>dist[g.g]=0);done.forEach(a=>dist[a.grade]++);
  // 强制分布建议 (常态曲线): S10 A20 B40 C20 D10
  const ideal={S:10,A:20,B:40,C:20,D:10};
  // 各主管评分宽松度
  const mgrStats={};
  done.forEach(a=>{const e=empById(a.empId);const m=e.mgr||'_self';mgrStats[m]=mgrStats[m]||[];mgrStats[m].push(a.totalScore);});
  const overallAvg=done.length?done.reduce((s,a)=>s+a.totalScore,0)/done.length:0;
  c.innerHTML=`<div class="section-head"><div><div class="eyebrow">${esc(CYCLE.name)}</div>
    <h2 style="font-size:21px;color:var(--navy);margin-top:4px">校准会议 Calibration</h2>
    <div class="sub">对齐评分标准、检测评分偏差,确保公平 — 已完成 ${done.length} 笔</div></div></div>
  ${!done.length?emptyBox('尚无完成的考核','完成评分后才能进行校准分析'):`
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="card card-pad"><h3 style="margin-bottom:6px">实际 vs 建议分布</h3>
      <p class="muted" style="font-size:12px;margin-bottom:14px">参照常态分布(强制分布)检视等级是否合理</p>
      ${DB.settings.grades.map(g=>{const n=dist[g.g],ap=done.length?Math.round(n/done.length*100):0,ip=ideal[g.g];
        return `<div style="margin-bottom:13px"><div class="flex between" style="font-size:12.5px;margin-bottom:5px">
          <span><span class="grade-pill g-${g.g}" style="width:22px;height:22px;font-size:11px">${g.g}</span> ${g.label}</span>
          <span class="num">实际 ${ap}% <span class="muted">/ 建议 ${ip}%</span></span></div>
          <div class="bar" style="position:relative"><i style="width:${ap}%;background:${gradeColor(g.g)}"></i>
          <span style="position:absolute;top:-3px;left:${ip}%;width:2px;height:13px;background:var(--navy-d)"></span></div></div>`}).join('')}
      <div class="muted" style="font-size:11.5px;margin-top:6px">▏黑线 = 建议比例</div>
    </div>
    <div class="card card-pad"><h3 style="margin-bottom:6px">主管评分宽松度</h3>
      <p class="muted" style="font-size:12px;margin-bottom:14px">全员平均 ${overallAvg.toFixed(1)} 分 · 偏离越大越需校准</p>
      ${Object.entries(mgrStats).map(([m,arr])=>{const avg=arr.reduce((s,x)=>s+x,0)/arr.length;const diff=avg-overallAvg;
        const nm=m==='_self'?'(无主管/高管)':(empById(m)?.name||'—');
        const tag=diff>5?'tag-red':diff<-5?'tag-blue':'tag-green';const lab=diff>5?'偏宽松':diff<-5?'偏严苛':'正常';
        return `<div class="flex between aic" style="padding:9px 0;border-bottom:1px solid var(--line-2)">
          <div><b style="font-size:13px">${esc(nm)}</b> <span class="muted" style="font-size:11.5px">${arr.length} 人</span></div>
          <div class="flex aic gap8"><span class="num" style="font-weight:700">${avg.toFixed(1)}</span>
          <span class="tag ${tag}">${lab} ${diff>0?'+':''}${diff.toFixed(1)}</span></div></div>`}).join('')}
    </div>
  </div>
  <div class="card card-pad mt24"><div class="flex between aic" style="margin-bottom:8px"><h3>校准清单(可手动调整等级)</h3>
    <span class="muted" style="font-size:12px">校准会议中如有共识,可微调个别等级</span></div>
    <div class="t-wrap" style="box-shadow:none;border:none"><table>
      <thead><tr><th>员工</th><th>部门</th><th>主管</th><th>得分</th><th>系统等级</th><th>校准后</th></tr></thead><tbody>
      ${[...done].sort((a,b)=>b.totalScore-a.totalScore).map(a=>{const e=empById(a.empId);
        return `<tr><td style="font-weight:600">${esc(e.name)}</td><td>${esc(deptName(e.dept))}</td>
        <td>${e.mgr?esc(empById(e.mgr)?.name||'—'):'—'}</td><td class="num" style="font-weight:700">${a.totalScore}</td>
        <td><span class="grade-pill g-${a.grade}">${a.grade}</span></td>
        <td><select onchange="calibrate('${a.id}',this.value)" style="padding:5px 8px;border:1.5px solid var(--line);border-radius:7px;background:#fbfaf7">
          ${DB.settings.grades.map(g=>`<option value="${g.g}" ${g.g===a.grade?'selected':''}>${g.g} · ${g.label}</option>`).join('')}</select></td></tr>`}).join('')}
    </tbody></table></div></div>`}`;
}
function calibrate(aid,grade){
  const a=DB.appraisals.find(x=>x.id===aid);const g=DB.settings.grades.find(x=>x.g===grade);
  a.grade=g.g;a.salaryAdj=g.adj;a.bonus=g.bonus;a.recommend=g.note;a.calibrated=true;
  save();toast('已校准为 '+grade+' 级','ok');
}

function rel360(r){return {self:'自评',manager:'上级',peer:'同级',report:'下属'}[r]||r;}
function render360Results(){
  const cy=CYCLE.id;
  const subjects=[...new Set(DB.feedback360.filter(f=>f.cycleId===cy).map(f=>f.subjectId))];
  if(!subjects.length)return `<div class="card card-pad mt24">${emptyBox('尚未发起 360° 评估','点击「发起评估」为员工建立多源反馈')}</div>`;
  const sel=F360_SUBJECT||subjects[0];
  return `<div class="card card-pad mt24">
    <div class="flex between aic" style="flex-wrap:wrap;gap:10px;margin-bottom:14px"><h3>评估结果汇总</h3>
      <select onchange="F360_SUBJECT=this.value;renderView('feedback360')" style="padding:7px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fbfaf7">

    ${aggregate360(sel)}</div>`;
}
let F360_SUBJECT=null;
function aggregate360(subjectId){
  const recs=DB.feedback360.filter(f=>f.subjectId===subjectId&&f.cycleId===CYCLE.id&&f.done);
  if(!recs.length)return `<div class="muted">尚无人提交评估(共 ${DB.feedback360.filter(f=>f.subjectId===subjectId&&f.cycleId===CYCLE.id).length} 份待回收)</div>`;
  const comps=DB.settings.comp;
  const byRel={};['self','manager','peer','report'].forEach(r=>{const rr=recs.filter(x=>x.relation===r);if(rr.length)byRel[r]=rr;});
  const submitted=Object.entries(byRel).map(([r,arr])=>`<span class="rel-tab">${rel360(r)} ${arr.length}</span>`).join('');
  // 每能力:自评 vs 他评(非自评平均)
  const rows=comps.map(comp=>{
    const selfV=byRel.self?avg(byRel.self.map(x=>x.scores[comp]||0)):null;
    const others=recs.filter(x=>x.relation!=='self');
    const otherV=others.length?avg(others.map(x=>x.scores[comp]||0)):null;
    const gap=(selfV!=null&&otherV!=null)?(selfV-otherV):null;
    return {comp,selfV,otherV,gap};
  });
  return `<div style="margin-bottom:12px">参与:${submitted}</div>
    <div class="gap-row" style="font-weight:700;color:var(--muted);border-bottom:1.5px solid var(--line)"><span>能力项</span><span>他评(均分,▏=自评)</span><span class="right">差距</span></div>
    ${rows.map(r=>{const op=(r.otherV||0)/5*100,sp=(r.selfV||0)/5*100;
      const gtag=r.gap==null?'':r.gap>0.6?'<span class="tag tag-amber">高估</span>':r.gap<-0.6?'<span class="tag tag-green">低估</span>':'<span class="tag tag-gray">一致</span>';
      return `<div class="gap-row"><span class="gname">${esc(r.comp)}</span>
        <div class="minibar"><i style="width:${op}%"></i>${r.selfV!=null?`<span class="mk" style="left:${sp}%"></span>`:''}</div>
        <span class="right num" style="font-weight:700">${r.otherV?r.otherV.toFixed(1):'—'}</span></div>
        <div style="font-size:11px;color:var(--muted);margin:-4px 0 4px 106px">${r.selfV!=null?`自评 ${r.selfV.toFixed(1)} `:''}${gtag}</div>`}).join('')}
    <div class="mt16" style="font-size:12.5px;color:var(--muted)">「高估」= 自评高于他人评价(可能的盲区);「低估」= 自评低于他人(被低估的优势)。</div>`;
}
function avg(a){return a.length?a.reduce((s,x)=>s+(+x||0),0)/a.length:0;}
function launch360(){
  const emps=DB.employees.filter(e=>e.status==='在职');
  modal('发起 360° 评估',`
    <div class="fg"><label>评估对象</label><select id="f3_sub">${emps.map(e=>`<option value="${e.id}">${esc(e.name)} · ${esc(deptName(e.dept))}</option>`).join('')}</select></div>
    <p class="muted" style="font-size:12.5px;margin-top:14px">系统会自动指派评估人:本人(自评)、直属主管(上级)、同部门同事(同级,最多3位)、直接下属(下属)。被指派者会在「360°评估 → 待我填写」看到任务。</p>`,
    ()=>{
      const sid=val('f3_sub');const subj=empById(sid);
      // 移除该对象本周期旧的未完成记录
      DB.feedback360=DB.feedback360.filter(f=>!(f.subjectId===sid&&f.cycleId===CYCLE.id&&!f.done));
      const raters=[];
      raters.push({rid:sid,rel:'self'});
      if(subj.mgr)raters.push({rid:subj.mgr,rel:'manager'});
      DB.employees.filter(e=>e.dept===subj.dept&&e.id!==sid&&e.status==='在职').slice(0,3).forEach(p=>raters.push({rid:p.id,rel:'peer'}));
      teamOf(sid).forEach(r=>raters.push({rid:r.id,rel:'report'}));
      raters.forEach(r=>{
        if(DB.feedback360.some(f=>f.subjectId===sid&&f.raterId===r.rid&&f.cycleId===CYCLE.id&&f.relation===r.rel))return;
        DB.feedback360.push({id:uid('f'),cycleId:CYCLE.id,subjectId:sid,raterId:r.rid,relation:r.rel,scores:{},comment:'',done:false});
      });
      save();F360_SUBJECT=sid;renderView('feedback360');toast(`已为 ${subj.name} 指派 ${raters.length} 位评估人`,'ok');
    });
}

/* ========== AI 助手 (Claude in Claude) ========== */
let AI_HISTORY=[];
function openAI(){
  document.getElementById('aiPanel').classList.add('open');
  if(!AI_HISTORY.length){
    aiAddMsg('a','你好,我是绩效 AI 助手 👋\n我可以分析当前的考核数据、九宫格、OKR 进度等,帮你做人才决策。试试下面的问题,或直接问我。');
    renderAISugg(['这个周期整体表现如何?','谁是高潜力但绩效待提升的员工?','哪个部门的平均分最高?','哪些人应该考虑晋升?']);
  }
  setTimeout(()=>document.getElementById('aiInput')?.focus(),300);
}
function closeAI(){document.getElementById('aiPanel').classList.remove('open');}
function renderAISugg(arr){document.getElementById('aiSugg').innerHTML=arr.map(s=>`<button onclick="quickAI('${esc(s).replace(/'/g,'')}')">${esc(s)}</button>`).join('');}
function quickAI(s){document.getElementById('aiInput').value=s;sendAI();}
function aiAddMsg(role,text){
  AI_HISTORY.push({role:role==='u'?'user':'assistant',content:text});
  const el=document.getElementById('aiMsgs');
  const d=document.createElement('div');d.className='ai-msg '+role;d.innerHTML=mdLite(text);el.appendChild(d);el.scrollTop=el.scrollHeight;
  return d;
}
function mdLite(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');}
function buildAIContext(){
  // 汇总当前周期数据(脱敏到姓名+岗位,适合分析)
  const done=DB.appraisals.filter(a=>a.cycleId===CYCLE.id&&a.status==='done');
  const lines=[];
  lines.push(`当前考核周期:${CYCLE.name}(权重 KPI ${CYCLE.weights.kpi}% / 能力 ${CYCLE.weights.comp}% / 态度 ${CYCLE.weights.att}%)`);
  lines.push(`在职员工 ${DB.employees.filter(e=>e.status==='在职').length} 人,已完成考核 ${done.length} 人。`);
  lines.push('【已完成考核明细】');
  done.forEach(a=>{const e=empById(a.empId);const pot=['低','中','高'][(DB.potential[e.id]||2)-1];
    lines.push(`- ${e.name}(${deptName(e.dept)}/${e.pos}):综合${a.totalScore} 等级${a.grade},KPI ${calcKPI(a)} 能力 ${calcComp(a)} 态度 ${calcAtt(a)};潜力${pot};调薪建议+${a.salaryAdj}%,${a.recommend}`);});
  // OKR
  const objs=DB.objectives.filter(o=>o.cycleId===CYCLE.id);
  if(objs.length){lines.push('【OKR 进度】');objs.forEach(o=>lines.push(`- [${o.type}] ${objOwnerName(o)}:${o.title} — 进度 ${objProgress(o)}%`));}
  // Kudos
  if(DB.kudos.length){const cnt={};DB.kudos.forEach(k=>cnt[k.toId]=(cnt[k.toId]||0)+1);
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([id,n])=>`${empById(id)?.name}(${n}次)`).join('、');
    lines.push(`【近期认可】收到最多认可:${top}`);}
  return lines.join('\n');
}
async function sendAI(){
  const inp=document.getElementById('aiInput');const q=inp.value.trim();if(!q)return;
  inp.value='';inp.style.height='auto';
  document.getElementById('aiSugg').innerHTML='';
  aiAddMsg('u',q);
  const btn=document.getElementById('aiSend');btn.disabled=true;
  const el=document.getElementById('aiMsgs');
  const load=document.createElement('div');load.className='ai-msg a';load.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';el.appendChild(load);el.scrollTop=el.scrollHeight;
  const sys=`你是企业绩效管理系统内建的 AI 分析助手,服务对象是 HR 与管理层。请基于以下「系统数据」用简体中文专业、简洁地回答问题,给出可执行的人才管理建议。不要编造数据中没有的人或数字。适当使用 **粗体** 强调重点。\n\n=== 系统数据 ===\n${buildAIContext()}`;
  try{
    const msgs=AI_HISTORY.slice(-8).map(m=>({role:m.role,content:m.content}));
    const headers={'Content-Type':'application/json'};
    if(DB.settings.apiKey){headers['x-api-key']=DB.settings.apiKey;headers['anthropic-version']='2023-06-01';headers['anthropic-dangerous-direct-browser-access']='true';}
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1024,system:sys,messages:msgs})});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n')||'(没有返回内容)';
    load.remove();aiAddMsg('a',text);
  }catch(err){
    load.remove();
    aiAddMsg('a','⚠️ 无法连接 AI 服务。\n\n在 Claude 的预览环境中可直接使用;若你已把系统部署到自己的网站(如 GitHub Pages),需到「系统设定 → AI 设定」填入 Anthropic API Key 才能启用。\n\n错误:'+esc(err.message));
  }
  btn.disabled=false;
}
/* 在考核表评语处用 AI 起草 */
async function aiDraftComment(targetId,kind){
  const ta=document.getElementById(targetId);if(!ta)return;
  const a=CURA;const e=empById(a.empId);
  const bullets=ta.value.trim();
  const ctx=`员工:${e.name}(${e.pos});本次 KPI ${calcKPI(withSelf(a))} 能力 ${calcComp(withSelf(a))} 态度 ${calcAtt(withSelf(a))}。`;
  const prompt=kind==='self'
    ? `请把以下要点整理成一段专业、得体的员工自评(第一人称,简体中文,120字内):\n要点:${bullets||'(请根据数据生成一段中肯的自评)'}\n\n${ctx}`
    : `请把以下要点整理成一段专业、建设性的主管评语(简体中文,120字内,先肯定再给改进建议):\n要点:${bullets||'(请根据数据生成一段中肯的评语)'}\n\n${ctx}`;
  const old=ta.value;ta.value='✨ AI 正在起草…';ta.disabled=true;
  try{
    const headers={'Content-Type':'application/json'};
    if(DB.settings.apiKey){headers['x-api-key']=DB.settings.apiKey;headers['anthropic-version']='2023-06-01';headers['anthropic-dangerous-direct-browser-access']='true';}
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:400,messages:[{role:'user',content:prompt}]})});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    ta.value=text||old;ta.disabled=false;ta.dispatchEvent(new Event('input'));
    toast('AI 已生成草稿,可再编辑','ok');
  }catch(err){ta.value=old;ta.disabled=false;toast('AI 起草失败:预览环境可用,自有部署需在设定填 API Key','err');}
}


function modal(title,body,onOk,okText,cls){
  MODAL_OK=onOk;
  document.getElementById('modalBox').className='modal '+(cls||'');
  document.getElementById('modalBox').innerHTML=`
    <div class="modal-head"><h3>${esc(title)}</h3><div class="x" onclick="closeModal()">×</div></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">${onOk?'取消':'关闭'}</button>
      ${onOk?`<button class="btn btn-gold" onclick="modalOk()">${okText||'保存'}</button>`:''}</div>`;
  document.getElementById('modalBg').classList.add('show');
}
function modalOk(){if(MODAL_OK){const r=MODAL_OK();if(r!==false)closeModal();}else closeModal();}
function closeModal(){document.getElementById('modalBg').classList.remove('show');MODAL_OK=null;CURA=null;}
function confirmBox(msg,onYes){modal('请确认',`<p style="font-size:14px;line-height:1.7">${esc(msg)}</p>`,()=>{onYes();},'确定');}
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});

<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Portal Kakitangan · Koperasi Kemajuan Kerjaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#00123A;--navy-900:#051D45;--navy-800:#052A5C;--navy-700:#073572;
  --navy-600:#0A4690;--navy-500:#1257AD;--navy-200:#C8D6EC;--navy-100:#E2EAF6;--navy-50:#F0F5FB;
  --teal-700:#0F7F72;--teal-600:#168D7F;--teal-500:#20A99A;--teal-400:#3DC3B4;--teal-100:#D6F4EF;--teal-50:#ECFAF7;
  --gold-600:#C08A2A;--gold-500:#D4A038;--gold-400:#E6B84F;--gold-300:#F0C366;--gold-100:#FBEFD3;
  --gray-950:#0B0F18;--gray-900:#151A26;--gray-800:#232A38;--gray-700:#3A4252;--gray-600:#586173;
  --gray-500:#76808F;--gray-400:#9AA3B2;--gray-300:#C2C9D4;--gray-200:#DCE1E9;--gray-100:#ECEFF4;--gray-50:#F5F7FA;
  --ok:#16A34A;--okbg:#DCFCE7;--warn:#B45309;--warnbg:#FEF3C7;--bad:#B42318;--badbg:#FEE4E2;
  --font:'Plus Jakarta Sans',sans-serif;--r-sm:8px;--r-md:13px;--r-lg:18px;
  --sh:0 1px 3px rgba(10,20,50,.07),0 1px 2px rgba(10,20,50,.05);
  --sh-lg:0 12px 36px rgba(0,18,58,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--gray-50);color:var(--gray-900);-webkit-font-smoothing:antialiased;line-height:1.5}
img{display:block;max-width:100%}button{font-family:var(--font);cursor:pointer}
input,select{font-family:var(--font)}
.hidden{display:none!important}

/* ══ LOGIN ══ */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(120% 120% at 80% 0%,var(--teal-700) 0%,var(--navy-800) 42%,var(--navy-950) 100%);position:relative;overflow:hidden}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold-300);opacity:.0;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.85;transform:scale(1)}}
.login-card{position:relative;z-index:2;width:100%;max-width:400px;background:#fff;border-radius:22px;box-shadow:0 30px 80px rgba(0,10,40,.5);overflow:hidden}
.login-top{padding:30px 30px 22px;text-align:center;background:linear-gradient(150deg,var(--navy-900),var(--navy-700) 60%,var(--teal-700))}
.login-top img{width:74px;height:74px;object-fit:contain;margin:0 auto 14px;background:#fff;border-radius:16px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.login-top h1{color:#fff;font-size:18px;font-weight:800;letter-spacing:-.01em}
.login-top p{color:rgba(255,255,255,.72);font-size:12px;margin-top:4px}
.login-body{padding:26px 30px 30px}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--gray-700);margin-bottom:7px}
.fld input{width:100%;padding:12px 14px;font-size:14px;border:1.5px solid var(--gray-200);border-radius:var(--r-md);background:#fff;transition:.18s}
.fld input:focus{outline:none;border-color:var(--teal-500);box-shadow:0 0 0 3px rgba(32,169,154,.15)}
.login-btn{width:100%;padding:14px;border:none;border-radius:var(--r-md);color:#fff;font-size:15px;font-weight:700;
  background:linear-gradient(135deg,var(--navy-700),var(--navy-600));transition:.2s}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(7,53,114,.32)}
.login-err{display:none;background:var(--badbg);color:var(--bad);font-size:12.5px;font-weight:500;padding:10px 12px;border-radius:var(--r-sm);margin-bottom:14px}
.login-err.show{display:block}
.demo-zone{margin-top:20px;padding-top:18px;border-top:1px dashed var(--gray-200)}
.demo-zone p{font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.demo-chips{display:flex;flex-wrap:wrap;gap:7px}
.demo-chip{font-size:12px;font-weight:600;padding:7px 12px;border-radius:99px;border:1.5px solid var(--navy-100);background:var(--navy-50);color:var(--navy-700);transition:.16s}
.demo-chip:hover{background:var(--navy-700);color:#fff;border-color:var(--navy-700)}
.mode-pill{position:absolute;top:16px;left:16px;z-index:3;font-size:11px;font-weight:700;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)}

/* ══ APP SHELL ══ */
#appView{min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;height:60px;background:#fff;border-bottom:1px solid var(--gray-100);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.tb-left{display:flex;align-items:center;gap:11px}
.tb-logo{width:38px;height:38px;object-fit:contain}
.tb-title{font-size:14px;font-weight:800;color:var(--navy-800);line-height:1.1}
.tb-title small{display:block;font-size:10px;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:.04em}
.tb-right{display:flex;align-items:center;gap:12px}
.cloud-pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px}
.cloud-pill.cloud{background:var(--okbg);color:var(--ok)}
.cloud-pill.demo{background:var(--gold-100);color:var(--gold-600)}
.tb-user{display:flex;align-items:center;gap:9px}
.tb-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--navy-600),var(--teal-600))}
.tb-uinfo{line-height:1.15}.tb-uinfo b{font-size:13px;color:var(--gray-900)}.tb-uinfo span{display:block;font-size:11px;color:var(--gray-500)}
.tb-logout{border:1.5px solid var(--gray-200);background:#fff;border-radius:var(--r-sm);padding:7px 12px;font-size:12.5px;font-weight:700;color:var(--gray-600);transition:.16s}
.tb-logout:hover{border-color:var(--badbg);color:var(--bad);background:var(--badbg)}
.shell{display:flex;max-width:1320px;margin:0 auto}
.sidebar{width:218px;flex:0 0 218px;padding:18px 12px;border-right:1px solid var(--gray-100);background:#fff;min-height:calc(100vh - 60px);position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.side-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--r-md);font-size:13.5px;font-weight:600;color:var(--gray-600);transition:.15s;border:none;background:none;width:100%;text-align:left;margin-bottom:3px}
.side-item .ic{width:20px;text-align:center;font-size:15px}
.side-item:hover{background:var(--gray-50);color:var(--navy-700)}
.side-item.active{background:var(--navy-700);color:#fff}
.side-sep{font-size:10px;font-weight:800;color:var(--gray-300);text-transform:uppercase;letter-spacing:.06em;padding:14px 13px 6px}
.main{flex:1;padding:24px;min-width:0}
.page-head{margin-bottom:20px}
.page-head h2{font-size:22px;font-weight:800;color:var(--navy-900);letter-spacing:-.02em}
.page-head p{font-size:13px;color:var(--gray-500);margin-top:3px}
.scope-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.scope-bar select{padding:8px 12px;border:1.5px solid var(--gray-200);border-radius:var(--r-sm);font-size:13px;font-weight:600;color:var(--gray-700);background:#fff}

/* cards */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.kcard{background:#fff;border:1px solid var(--gray-100);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh)}
.kcard-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kcard-label{font-size:12px;font-weight:700;color:var(--gray-500)}
.kcard-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px}
.kcard-num{font-size:26px;font-weight:800;color:var(--navy-800);letter-spacing:-.02em}
.kcard-num small{font-size:14px;font-weight:700;color:var(--gray-400)}
.kcard-sub{font-size:11.5px;color:var(--gray-500);margin-top:4px}
.bar{height:7px;background:var(--gray-100);border-radius:99px;overflow:hidden;margin-top:11px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.t-navy .kcard-ic{background:var(--navy-50);color:var(--navy-600)}.t-navy .bar i{background:var(--navy-600)}
.t-teal .kcard-ic{background:var(--teal-50);color:var(--teal-600)}.t-teal .bar i{background:var(--teal-500)}.t-teal .kcard-num{color:var(--teal-700)}
.t-gold .kcard-ic{background:var(--gold-100);color:var(--gold-600)}.t-gold .bar i{background:var(--gold-400)}.t-gold .kcard-num{color:var(--gold-600)}

/* panels */
.panel{background:#fff;border:1px solid var(--gray-100);border-radius:var(--r-lg);box-shadow:var(--sh);margin-bottom:20px;overflow:hidden}
.panel-head{padding:16px 18px;border-bottom:1px solid var(--gray-100);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.panel-head h3{font-size:15px;font-weight:800;color:var(--navy-800)}
.panel-body{padding:18px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:800;color:var(--gray-500);text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:11px 12px;border-bottom:1.5px solid var(--gray-100);white-space:nowrap}
td{font-size:13px;padding:11px 12px;border-bottom:1px solid var(--gray-100);color:var(--gray-800);white-space:nowrap}
tr:last-child td{border-bottom:none}
.tnum{font-weight:700;text-align:right}
.t-right{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.pill.cs{background:var(--navy-50);color:var(--navy-600)}.pill.leader{background:var(--teal-50);color:var(--teal-700)}
.pill.manager{background:var(--gold-100);color:var(--gold-600)}.pill.hq{background:#EDE9FE;color:#6D28D9}.pill.boss{background:var(--navy-800);color:#fff}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.miss{background:var(--badbg);color:var(--bad)}
.medal{font-size:15px}
.mini-rank{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--gray-100)}
.mini-rank:last-child{border-bottom:none}
.mr-pos{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;background:var(--gray-100);color:var(--gray-600)}
.mr-pos.g1{background:var(--gold-300);color:var(--navy-900)}.mr-pos.g2{background:var(--gray-300)}.mr-pos.g3{background:#E8B98A}
.mr-name{flex:1;font-size:13px;font-weight:600}.mr-val{font-size:13px;font-weight:800;color:var(--navy-700)}

/* forms */
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:13px;margin-bottom:14px}
.frow label{display:block;font-size:12px;font-weight:600;color:var(--gray-600);margin-bottom:6px}
.frow input,.frow select{width:100%;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:var(--r-sm);font-size:14px}
.frow input:focus,.frow select:focus{outline:none;border-color:var(--teal-500);box-shadow:0 0 0 3px rgba(32,169,154,.13)}
.btn{border:none;border-radius:var(--r-sm);padding:11px 20px;font-size:14px;font-weight:700;color:#fff;background:var(--navy-700);transition:.18s}
.btn:hover{background:var(--navy-800)}
.btn.teal{background:var(--teal-600)}.btn.teal:hover{background:var(--teal-700)}
.btn.ghost{background:#fff;border:1.5px solid var(--gray-200);color:var(--gray-700)}.btn.ghost:hover{border-color:var(--navy-200);color:var(--navy-700)}
.btn.sm{padding:7px 13px;font-size:12.5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy-900);color:#fff;padding:13px 20px;border-radius:var(--r-md);font-size:13.5px;font-weight:600;box-shadow:var(--sh-lg);z-index:200;opacity:0;transition:.3s}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.tabs{display:flex;gap:6px;background:var(--gray-50);padding:5px;border-radius:var(--r-md);margin-bottom:16px;width:fit-content}
.tab{border:none;background:none;padding:9px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:700;color:var(--gray-500)}
.tab.active{background:#fff;color:var(--navy-700);box-shadow:var(--sh)}
.empty{text-align:center;padding:30px;color:var(--gray-400);font-size:13px}
.heat{display:inline-block;min-width:34px;text-align:center;padding:3px 6px;border-radius:6px;font-size:12px;font-weight:700}

/* mobile */
.hamb{display:none;border:none;background:none;font-size:22px;color:var(--navy-700)}
@media(max-width:860px){
  .sidebar{position:fixed;top:60px;left:0;z-index:60;transform:translateX(-100%);transition:.25s;box-shadow:var(--sh-lg)}
  .sidebar.open{transform:translateX(0)}
  .hamb{display:block}
  .main{padding:18px 14px}
  .tb-uinfo{display:none}
  .backdrop{display:none;position:fixed;inset:60px 0 0 0;background:rgba(0,18,58,.35);z-index:55}
  .backdrop.show{display:block}
}
@media(min-width:861px){.backdrop{display:none}}
</style>
</head>

<script>
/* ════════════════════════════════════════════════════════════════
   KONFIGURASI FIREBASE  —  PROJEK BARU UNTUK KOPERASI (asingkan dari AWARA)
   1. Buka https://console.firebase.google.com → cipta projek baru
   2. Add app (Web) → salin config → tampal di bawah
   3. Enable Authentication → Email/Password
   4. Cipta Firestore Database (mod production) + pasang rules
   Selagi apiKey masih 'GANTI_SAYA', sistem jalan dalam MOD DEMO automatik.
   ════════════════════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey: "GANTI_SAYA",
  authDomain: "koperasi-kerjaya.firebaseapp.com",
  projectId: "koperasi-kerjaya",
  storageBucket: "koperasi-kerjaya.appspot.com",
  messagingSenderId: "",
  appId: ""
};

const ROLES = {
  cs:     {label:'CS',               rank:1},
  leader: {label:'Ketua Pasukan',    rank:2},
  manager:{label:'Pengurus Cawangan',rank:3},
  hq:     {label:'Ibu Pejabat (HQ)', rank:4},
  boss:   {label:'Pengarah / Admin', rank:5}
};
const METRICS = {
  payslip:  {label:'Payslip',   short:'Payslip', t:'navy', ic:'📄'},
  permohonan:{label:'Permohonan',short:'Mohon',  t:'navy', ic:'📝'},
  pencairanRM:{label:'Pencairan (RM)',short:'RM', t:'gold', ic:'💰', money:true},
  pencairanKes:{label:'Pencairan (Kes)',short:'Kes',t:'gold',ic:'✅'},
  panggilan:{label:'Panggilan', short:'Call',   t:'teal', ic:'📞'},
  whatsapp: {label:'WhatsApp',  short:'WA',      t:'teal', ic:'💬'}
};
// Sasaran bulanan lalai (boleh ubah di Tetapan)
let TARGETS = {payslip:30, permohonan:24, pencairanKes:12, pencairanRM:200000, panggilan:1500, whatsapp:300};

let MODE='demo', db=null, auth=null;
let DB = {staff:[], activities:[], disbursements:[]};
let CURRENT=null, CURVIEW='dashboard';
let scopeBranch='all', scopeMonth=ym(new Date());

/* ───────── util ───────── */
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function todayISO(){return new Date().toISOString().slice(0,10);}
function fmt(n){return Number(n||0).toLocaleString('ms-MY');}
function fmtRM(n){return 'RM '+fmt(Math.round(n||0));}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function initials(n){return (n||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function byId(id){return DB.staff.find(s=>s.id===id);}

/* ───────── DEMO SEED ───────── */
function seedDemo(){
  DB.staff=[
    {id:'BOSS', nama:'Wilson Ooi',  role:'boss',    branch:'HQ', leaderId:null, emel:'wilson@koperasikerjaya.my'},
    {id:'HQ1',  nama:'Siti Aminah', role:'hq',      branch:'HQ', leaderId:null, emel:'siti@koperasikerjaya.my'},
    {id:'MPG',  nama:'Hafiz Rahman',role:'manager', branch:'Pulau Pinang', leaderId:null, emel:'hafiz@koperasikerjaya.my'},
    {id:'LPG',  nama:'Aishah Yusof',role:'leader',  branch:'Pulau Pinang', leaderId:'MPG', emel:'aishah@koperasikerjaya.my'},
    {id:'C1',   nama:'Farah Lim',   role:'cs',      branch:'Pulau Pinang', leaderId:'LPG', emel:'farah@koperasikerjaya.my'},
    {id:'C2',   nama:'Daniel Tan',  role:'cs',      branch:'Pulau Pinang', leaderId:'LPG', emel:'daniel@koperasikerjaya.my'},
    {id:'MKL',  nama:'Raj Kumar',   role:'manager', branch:'Kuala Lumpur', leaderId:null, emel:'raj@koperasikerjaya.my'},
    {id:'LKL',  nama:'Mei Ling',    role:'leader',  branch:'Kuala Lumpur', leaderId:'MKL', emel:'meiling@koperasikerjaya.my'},
    {id:'C3',   nama:'Kumaran',     role:'cs',      branch:'Kuala Lumpur', leaderId:'LKL', emel:'kumaran@koperasikerjaya.my'},
    {id:'C4',   nama:'Nurul Huda',  role:'cs',      branch:'Kuala Lumpur', leaderId:'LKL', emel:'nurul@koperasikerjaya.my'}
  ];
  const cs=DB.staff.filter(s=>s.role==='cs');
  const now=new Date(), m=now.getMonth(), y=now.getFullYear();
  const days=Math.min(now.getDate(),22);
  DB.activities=[]; DB.disbursements=[];
  const rnd=(a,b)=>Math.floor(a+Math.random()*(b-a));
  cs.forEach((s,i)=>{
    for(let d=1; d<=days; d++){
      const dt=new Date(y,m,d); const dow=dt.getDay();
      if(dow===0||dow===6) continue;            // skip weekend
      if(Math.random()<0.08) continue;          // some missing days
      DB.activities.push({id:s.id+'-'+d, staffId:s.id, branch:s.branch, date:dt.toISOString().slice(0,10),
        panggilan:rnd(40,95)+i*5, whatsapp:rnd(8,22), payslip:rnd(0,3), nota:''});
    }
    const nd=rnd(4,11);
    for(let k=0;k<nd;k++){
      const d=rnd(1,days);
      DB.disbursements.push({id:s.id+'-d'+k, staffId:s.id, leaderId:s.leaderId, branch:s.branch,
        date:new Date(y,m,d).toISOString().slice(0,10), amount:rnd(8,42)*1000, pelanggan:'Ahli #'+rnd(1000,9999)});
    }
  });
}

/* ───────── FIREBASE / CLOUD ───────── */
async function boot(){
  buildDemoChips();
  if(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey!=='GANTI_SAYA' && typeof firebase!=='undefined'){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      auth=firebase.auth(); db=firebase.firestore();
      MODE='cloud';
      document.getElementById('modePill').textContent='CLOUD';
      document.getElementById('demoZone').style.display='none';
      auth.onAuthStateChanged(async u=>{ if(u){ await loadCloud(); const me=DB.staff.find(s=>s.emel===u.email); if(me){CURRENT=me;enterApp();} } });
      return;
    }catch(e){ console.warn('Firebase init gagal, guna demo:',e); }
  }
  MODE='demo'; seedDemo();
}
async function loadCloud(){
  const [st,ac,di]=await Promise.all([
    db.collection('staff').get(), db.collection('activities').get(), db.collection('disbursements').get()
  ]);
  DB.staff=st.docs.map(d=>({id:d.id,...d.data()}));
  DB.activities=ac.docs.map(d=>({id:d.id,...d.data()}));
  DB.disbursements=di.docs.map(d=>({id:d.id,...d.data()}));
  const tg=await db.collection('config').doc('targets').get();
  if(tg.exists) TARGETS={...TARGETS,...tg.data()};
}
async function cloudSave(coll,id,obj){ if(MODE!=='cloud')return; try{await db.collection(coll).doc(id).set(obj,{merge:true});}catch(e){console.warn(e);} }

/* ───────── AUTH ───────── */
function buildDemoChips(){
  const wrap=document.getElementById('demoChips');
  const picks=[['BOSS','Pengarah'],['HQ1','HQ'],['MPG','Manager'],['LPG','Leader'],['C1','CS']];
  if(!DB.staff.length) seedDemo();
  wrap.innerHTML=picks.map(([id,lbl])=>`<button class="demo-chip" onclick="demoLogin('${id}')">${lbl}</button>`).join('');
}
function demoLogin(id){ if(!DB.staff.length)seedDemo(); CURRENT=byId(id); enterApp(); }
async function doLogin(){
  const e=document.getElementById('lEmail').value.trim().toLowerCase();
  const p=document.getElementById('lPass').value;
  const err=document.getElementById('loginErr');
  if(!e||!p){err.textContent='Sila isi emel dan kata laluan.';err.classList.add('show');return;}
  if(MODE==='cloud'){
    try{ await auth.signInWithEmailAndPassword(e,p); }
    catch(ex){ err.textContent='Emel atau kata laluan tidak sah.'; err.classList.add('show'); }

}

/* ───────── SCOPE / VISIBILITY ───────── */
function isManagement(r){return ROLES[r].rank>=2;}
function visibleStaff(){
  const r=CURRENT.role;
  if(r==='cs') return [CURRENT];
  if(r==='leader') return DB.staff.filter(s=>s.id===CURRENT.id || s.leaderId===CURRENT.id);
  if(r==='manager') return DB.staff.filter(s=>s.branch===CURRENT.branch);
  let all=DB.staff.filter(s=>s.role!=='boss'||true);
  if(scopeBranch!=='all') all=all.filter(s=>s.branch===scopeBranch);
  return all;
}
function branches(){return [...new Set(DB.staff.filter(s=>s.branch!=='HQ').map(s=>s.branch))];}

/* ───────── AGGREGATION ───────── */
function actAgg(staffIds,month){
  const set=new Set(staffIds);
  const a={panggilan:0,whatsapp:0,payslip:0};
  DB.activities.forEach(x=>{ if(set.has(x.staffId)&&x.date.startsWith(month)){a.panggilan+=x.panggilan||0;a.whatsapp+=x.whatsapp||0;a.payslip+=x.payslip||0;} });
  return a;
}
function disAgg(staffIds,month){
  const set=new Set(staffIds);
  let rm=0,kes=0;
  DB.disbursements.forEach(x=>{ if(set.has(x.staffId)&&x.date.startsWith(month)){rm+=x.amount||0;kes++;} });
  return {pencairanRM:rm,pencairanKes:kes};
}
function staffScore(s,month){
  const a=actAgg([s.id],month), d=disAgg([s.id],month);
  return {...a,...d, permohonan:a.payslip};
}

/* ───────── NAV ───────── */
function buildSidebar(){
  const r=CURRENT.role;
  const items=[
    {sep:'Saya'},
    {v:'dashboard', ic:'📊', t:'Papan Pemuka'},
    {v:'aktiviti',  ic:'📝', t:'Aktiviti Harian'},
    {v:'pencairan', ic:'💰', t:'Pencairan'},
    {v:'ranking',   ic:'🏆', t:'Ranking'}
  ];
  if(isManagement(r)) items.push({sep:'Pengurusan'},{v:'laporan', ic:'📅', t:'Laporan Harian'});
  if(r==='hq'||r==='boss') items.push({v:'kakitangan', ic:'👥', t:'Kakitangan'});
  if(r==='boss') items.push({v:'tetapan', ic:'⚙️', t:'Tetapan Sasaran'});
  document.getElementById('sidebar').innerHTML=items.map(it=>
    it.sep?`<div class="side-sep">${it.sep}</div>`
    :`<button class="side-item ${it.v===CURVIEW?'active':''}" data-v="${it.v}" onclick="go('${it.v}')"><span class="ic">${it.ic}</span>${it.t}</button>`
  ).join('');
}
function go(v){
  CURVIEW=v;
  document.querySelectorAll('.side-item').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
  ({dashboard:viewDashboard,aktiviti:viewAktiviti,pencairan:viewPencairan,ranking:viewRanking,laporan:viewLaporan,kakitangan:viewKakitangan,tetapan:viewTetapan}[v]||viewDashboard)();
}

/* ───────── SCOPE BAR (for management) ───────── */
function scopeBarHTML(showMonth=true){
  if(!isManagement(CURRENT.role)) return showMonth?`<div class="scope-bar"><label style="font-size:13px;font-weight:600;color:var(--gray-600)">Bulan</label><input type="month" id="scMonth" value="${scopeMonth}" onchange="scopeMonth=this.value;go(CURVIEW)" style="padding:8px 12px;border:1.5px solid var(--gray-200);border-radius:var(--r-sm);font-weight:600"></div>`:'';

        <td><span class="pill ${a?'ok':'miss'}">${a?'Diisi':'Belum isi'}</span></td></tr>`;
    });
    h+='</tbody></table></div></div>';
  } else {
    // weekly: week containing lapDate (Mon-Sun)
    const base=new Date(lapDate); const dow=(base.getDay()+6)%7; const mon=new Date(base); mon.setDate(base.getDate()-dow);
    const days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d.toISOString().slice(0,10);});
    const lbls=['Isn','Sel','Rab','Kha','Jum','Sab','Ahd'];
    h+=`<div class="scope-bar"><label style="font-size:13px;font-weight:600;color:var(--gray-600)">Minggu</label><input type="date" value="${lapDate}" onchange="lapDate=this.value;viewLaporan()" style="padding:8px 12px;border:1.5px solid var(--gray-200);border-radius:var(--r-sm);font-weight:600">
      <select onchange="lapMetric=this.value;viewLaporan()" style="margin-left:6px">

        <option value="whatsapp"${lapMetric==='whatsapp'?' selected':''}>💬 WhatsApp</option>
        <option value="payslip"${lapMetric==='payslip'?' selected':''}>📄 Payslip</option></select></div>`;
    const get=(id,d)=>{const a=DB.activities.find(x=>x.staffId===id&&x.date===d);return a?(a[lapMetric]||0):null;};
    let best=null;
    h+=`<div class="panel"><div class="panel-body" style="overflow-x:auto;padding:0"><table><thead><tr><th>CS</th>${lbls.map((l,i)=>`<th class="t-right">${l}<br><span style="font-weight:500;color:var(--gray-300)">${days[i].slice(8)}</span></th>`).join('')}<th class="t-right">Jumlah</th><th class="t-right">Purata</th></tr></thead><tbody>`;
    staff.forEach(s=>{ let tot=0,cnt=0;
      const cells=days.map(d=>{const v=get(s.id,d);if(v!=null){tot+=v;cnt++;}
        const wd=new Date(d).getDay(); if(wd===0||wd===6||d>todayISO())return `<td class="t-right" style="color:var(--gray-300)">·</td>`;
        if(v==null)return `<td class="t-right"><span class="heat" style="background:var(--badbg);color:var(--bad)">0</span></td>`;
        const intensity=Math.min(1,v/(lapMetric==='panggilan'?120:lapMetric==='whatsapp'?25:4));
        return `<td class="t-right"><span class="heat" style="background:rgba(32,169,154,${.12+intensity*.6});color:${intensity>.6?'#fff':'var(--teal-700)'}">${fmt(v)}</span></td>`;
      }).join('');
      const avg=cnt?Math.round(tot/cnt):0; if(!best||avg>best.avg)best={s,avg};
      h+=`<tr><td><b>${esc(s.nama)}</b></td>${cells}<td class="tnum">${fmt(tot)}</td><td class="tnum" style="color:var(--teal-700)">${fmt(avg)}</td></tr>`;
    });
    h+='</tbody></table></div>';
    if(best)h+=`<div class="panel-head" style="border-top:1px solid var(--gray-100);border-bottom:none"><span style="font-size:13px;color:var(--gray-600)">⭐ Terbaik: <b style="color:var(--navy-700)">${esc(best.s.nama)}</b> (purata ${fmt(best.avg)}/hari)</span></div>`;
    h+='</div>';
  }
  document.getElementById('main').innerHTML=h;
}

/* ───────── VIEW: KAKITANGAN ───────── */
function viewKakitangan(){
  let h=`<div class="page-head"><h2>Kakitangan</h2><p>Senarai &amp; struktur pasukan</p></div>`+scopeBarHTML(false);
  let list=DB.staff.slice();
  if(scopeBranch!=='all') list=list.filter(s=>s.branch===scopeBranch);
  list.sort((a,b)=>ROLES[b.role].rank-ROLES[a.role].rank);
  h+=`<div class="panel"><div class="panel-head"><h3>👥 ${list.length} Kakitangan</h3>${CURRENT.role==='boss'?'<button class="btn teal sm" onclick="addStaff()">+ Tambah</button>':''}</div><div class="panel-body" style="overflow-x:auto;padding:0">
    <table><thead><tr><th>Nama</th><th>Peranan</th><th>Cawangan</th><th>Ketua</th><th>Emel</th></tr></thead><tbody>`;
  list.forEach(s=>{const ld=byId(s.leaderId);
    h+=`<tr><td><b>${esc(s.nama)}</b></td><td><span class="pill ${s.role}">${ROLES[s.role].label}</span></td><td>${esc(s.branch)}</td><td style="color:var(--gray-500)">${ld?esc(ld.nama):'—'}</td><td style="color:var(--gray-500)">${esc(s.emel)}</td></tr>`;
  });
  h+='</tbody></table></div></div>';
  document.getElementById('main').innerHTML=h;
}
function addStaff(){
  const nama=prompt('Nama penuh kakitangan:'); if(!nama)return;
  const role=prompt('Peranan (cs / leader / manager / hq):','cs'); if(!ROLES[role]){toast('Peranan tidak sah.');return;}
  const branch=prompt('Cawangan:','Pulau Pinang')||'Pulau Pinang';
  const emel=prompt('Emel:','')||'';
  const id='S'+Date.now();
  const obj={id,nama,role,branch,leaderId:null,emel};
  DB.staff.push(obj); cloudSave('staff',id,obj); toast('Kakitangan ditambah ✔'); go('kakitangan');
}

/* ───────── VIEW: TETAPAN ───────── */
function viewTetapan(){
  let h=`<div class="page-head"><h2>Tetapan Sasaran</h2><p>Sasaran KPI bulanan setiap CS</p></div>`;
  h+=`<div class="panel"><div class="panel-head"><h3>🎯 Sasaran Bulanan (per CS)</h3></div><div class="panel-body"><div class="frow">
    <div><label>📄 Payslip</label><input type="number" id="tPay" value="${TARGETS.payslip}"></div>
    <div><label>📝 Permohonan</label><input type="number" id="tMohon" value="${TARGETS.permohonan}"></div>
    <div><label>✅ Pencairan (kes)</label><input type="number" id="tKes" value="${TARGETS.pencairanKes}"></div>
    <div><label>💰 Pencairan (RM)</label><input type="number" id="tRM" value="${TARGETS.pencairanRM}"></div>
    <div><label>📞 Panggilan</label><input type="number" id="tCall" value="${TARGETS.panggilan}"></div>
    <div><label>💬 WhatsApp</label><input type="number" id="tWa" value="${TARGETS.whatsapp}"></div>
  </div><button class="btn" onclick="saveTargets()">Simpan Sasaran</button></div></div>`;
  h+=`<div class="panel"><div class="panel-head"><h3>☁ Backend</h3></div><div class="panel-body" style="font-size:13px;color:var(--gray-600);line-height:1.7">
    Mod semasa: <b style="color:${MODE==='cloud'?'var(--ok)':'var(--gold-600)'}">${MODE==='cloud'?'CLOUD (Firebase)':'DEMO (data sementara)'}</b>.
    ${MODE==='demo'?'Untuk simpan data sebenar &amp; kongsi antara kakitangan, isi <b>FIREBASE_CONFIG</b> di dalam fail dengan projek Firebase baru koperasi.':'Data disegerak ke Firestore secara automatik.'}
  </div></div>`;
  document.getElementById('main').innerHTML=h;
}
function saveTargets(){
  TARGETS={payslip:+document.getElementById('tPay').value||0, permohonan:+document.getElementById('tMohon').value||0,
    pencairanKes:+document.getElementById('tKes').value||0, pencairanRM:+document.getElementById('tRM').value||0,
    panggilan:+document.getElementById('tCall').value||0, whatsapp:+document.getElementById('tWa').value||0};
  cloudSave('config','targets',TARGETS); toast('Sasaran disimpan ✔');
}

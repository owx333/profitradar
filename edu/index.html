<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUNAS — 教育操作系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080F;--panel:rgba(20,26,44,.72);--panel-solid:#11172A;--panel-2:#161E36;
  --line:rgba(120,140,200,.16);--line-2:rgba(120,140,200,.28);
  --txt:#EEF2FF;--muted:#9AA8CE;--muted-2:#5C6A92;
  --champ:#E4C998;--champ-2:#C9A24B;--champ-soft:rgba(228,201,152,.14);
  --ok:#46DDA6;--warn:#F5C04E;--bad:#FF7488;--r:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter','Noto Sans SC',sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.5}
#ambient{position:fixed;inset:0;z-index:0;pointer-events:none;transition:background 1.4s cubic-bezier(.5,.1,.2,1);opacity:.85}
#grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.035;background-image:radial-gradient(circle at 1px 1px,#fff 1px,transparent 0);background-size:40px 40px}
.serif{font-family:'Fraunces','Noto Serif SC',serif}
.num{font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
:focus-visible{outline:2px solid var(--champ);outline-offset:3px;border-radius:8px}
.app{display:flex;min-height:100vh;position:relative;z-index:1}

.rail{width:236px;flex-shrink:0;position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(12,16,30,.6),rgba(6,8,15,.3));overflow-y:auto}
.rail::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}
.mark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(140deg,var(--champ),#fff6 60%,var(--champ-2));box-shadow:0 8px 28px rgba(228,201,152,.3)}
.mark span{font-family:'Fraunces',serif;font-weight:600;font-size:23px;color:#1a1408}
.brand .bn{font-family:'Fraunces',serif;font-weight:600;font-size:20px;letter-spacing:.5px;line-height:1}
.brand .bs{font-size:10px;letter-spacing:2.5px;color:var(--muted-2);text-transform:uppercase;margin-top:3px}
.rnav{display:flex;flex-direction:column;gap:3px;width:100%}
.rgrp{font-size:10px;letter-spacing:2px;color:var(--muted-2);text-transform:uppercase;padding:15px 14px 6px;font-weight:700}
.schoolsw{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:11.5px;color:var(--champ);background:var(--champ-soft);border:1px solid color-mix(in srgb,var(--champ) 30%,transparent);padding:4px 11px;border-radius:20px;font-weight:600;width:fit-content;transition:.2s}
.schoolsw:hover{background:color-mix(in srgb,var(--champ) 22%,transparent)}
.schoolsw svg{width:12px;height:12px;stroke:var(--champ);fill:none;stroke-width:2}
.rsep{height:1px;background:var(--line);margin:9px 10px}
.rb{display:flex;align-items:center;gap:13px;width:100%;padding:11px 13px;border-radius:13px;color:var(--muted);transition:.2s;position:relative;text-align:left}
.rb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
.rb .lbl{font-size:14px;font-weight:500;white-space:nowrap}
.rb:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.rb.on{color:var(--txt);background:var(--champ-soft)}
.rb.on::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--champ)}
.rb .ai{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--champ);box-shadow:0 0 8px var(--champ);flex-shrink:0}
.rb .bdg{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex-shrink:0}

.main{flex:1;min-width:0;padding:26px 40px 80px;max-width:1340px}
.topbar{display:flex;align-items:center;gap:18px;margin-bottom:28px;flex-wrap:wrap}
.tb-left{display:flex;flex-direction:column;gap:3px}
.tb-left .crumb{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted-2)}
.tb-left .nm{font-size:15px;color:var(--muted)}
.progchips{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.pc{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:30px;font-size:13px;font-weight:600;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px)}
.pc .d{width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor}
.activate{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:30px;font-size:13px;font-weight:600;background:linear-gradient(135deg,var(--champ),var(--champ-2));color:#1a1408;box-shadow:0 6px 20px rgba(228,201,152,.28);transition:.2s}
.activate:hover{transform:translateY(-2px)}
.activate svg{width:16px;height:16px;stroke:#1a1408;stroke-width:2.4;fill:none}
.lang{display:flex;gap:3px;background:var(--panel);padding:4px;border-radius:11px;border:1px solid var(--line)}
.lang button{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted)}
.lang button.on{background:rgba(255,255,255,.1);color:var(--txt)}

.view{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes laneIn{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}

.hero{position:relative;border-radius:var(--r);padding:30px 32px;margin-bottom:24px;overflow:hidden;background:linear-gradient(150deg,rgba(22,30,54,.85),rgba(11,15,26,.7));border:1px solid var(--line);backdrop-filter:blur(16px)}
.hero::after{content:"";position:absolute;inset:7px;border:1px solid var(--champ-soft);border-radius:14px;pointer-events:none}
.hero .row{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;flex-wrap:wrap;position:relative}
.hero .eyebrow{font-size:11.5px;letter-spacing:3px;text-transform:uppercase;color:var(--champ);margin-bottom:10px}
.hero h1{font-size:34px;font-weight:600;line-height:1.1;letter-spacing:-.5px}
.hero .meta{font-size:13.5px;color:var(--muted);margin-top:12px}
.hero .big{text-align:right}
.hero .big .n{font-family:'Fraunces',serif;font-size:54px;font-weight:500;line-height:.9}
.hero .big .l{font-size:12.5px;color:var(--muted);margin-top:6px}
.hero .strip{display:flex;gap:26px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.hero .stat .v{font-family:'Space Grotesk';font-size:21px;font-weight:600}
.hero .stat .k{font-size:11.5px;color:var(--muted);margin-top:2px}

.sh{display:flex;align-items:baseline;gap:12px;margin:30px 0 15px;flex-wrap:wrap}
.sh h2{font-family:'Fraunces','Noto Serif SC',serif;font-size:21px;font-weight:600}
.sh .hint{font-size:12.5px;color:var(--muted)}
.sh .tag{font-size:10px;letter-spacing:1.5px;padding:4px 10px;border-radius:20px;background:var(--champ-soft);color:var(--champ);font-weight:700;text-transform:uppercase}
.sh .act{margin-left:auto;font-size:12.5px;color:var(--champ);font-weight:600}

.lanes{display:flex;flex-direction:column;gap:13px}
.lane{position:relative;border-radius:18px;padding:20px 22px;overflow:hidden;cursor:pointer;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);transition:.25s;animation:laneIn .6s cubic-bezier(.2,.8,.2,1) both}
.lane:hover{border-color:var(--lh);transform:translateX(4px)}
.lane::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--lh)}
.lane .glow{position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--lh),transparent 70%);opacity:.14;pointer-events:none}
.lane .lrow{display:flex;align-items:center;gap:16px;position:relative;flex-wrap:wrap}
.lane .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;background:color-mix(in srgb,var(--lh) 18%,transparent);border:1px solid color-mix(in srgb,var(--lh) 40%,transparent)}
.lane .ico svg{width:23px;height:23px;stroke:var(--lh);fill:none;stroke-width:1.8}
.lane .title .t{font-family:'Noto Serif SC','Fraunces',serif;font-size:17px;font-weight:600}
.lane .title .s{font-size:12px;color:var(--muted);margin-top:2px}
.lane .mets{display:flex;gap:24px;margin-left:auto;flex-wrap:wrap}
.lane .met .v{font-family:'Space Grotesk';font-size:18px;font-weight:600}
.lane .met .v.sig{color:var(--lh)}
.lane .met .k{font-size:11px;color:var(--muted);margin-top:1px}
.lane .spark{width:80px;height:36px;flex-shrink:0}
.lane .spark polyline{fill:none;stroke:var(--lh);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;backdrop-filter:blur(14px);position:relative}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1.55fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}

.alert{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;transition:.2s}
.alert:hover{border-color:var(--ah);transform:translateY(-2px)}
.alert .ai2{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:color-mix(in srgb,var(--ah) 16%,transparent)}
.alert .ai2 svg{width:21px;height:21px;stroke:var(--ah);fill:none;stroke-width:1.9}
.alert .v{font-family:'Space Grotesk';font-size:20px;font-weight:600}
.alert .k{font-size:12px;color:var(--muted);margin-top:1px}

.brief{display:flex;gap:18px;align-items:flex-start}
.orb{width:46px;height:46px;border-radius:15px;flex-shrink:0;display:grid;place-items:center;background:linear-gradient(140deg,var(--champ),#fff5);box-shadow:0 8px 24px rgba(228,201,152,.3);animation:bob 3.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.04)}}
.orb svg{width:23px;height:23px;stroke:#1a1408;stroke-width:2;fill:none}
.brief .bd{font-size:14.5px;line-height:1.75;color:#D8E0FA}
.brief .bd b{color:#fff;font-weight:600}.brief .bd .hl{color:var(--champ);font-weight:600}

.feed{display:flex;flex-direction:column}
.fe{display:flex;gap:13px;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.05);align-items:center}
.fe:last-child{border:none}
.fe .pd{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}
.fe .tx{font-size:13.5px}.fe .tx em{color:var(--muted);font-style:normal}
.fe .tm{margin-left:auto;font-size:11px;color:var(--muted-2);white-space:nowrap}

.filterbar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.fb{padding:8px 15px;border-radius:30px;font-size:13px;font-weight:600;background:var(--panel);border:1px solid var(--line);color:var(--muted);transition:.18s;display:flex;align-items:center;gap:8px}
.fb.on{color:var(--txt);border-color:var(--fbh)}.fb.on .d{box-shadow:0 0 8px currentColor}
.fb .d{width:8px;height:8px;border-radius:50%}
.stud{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;transition:.24s;cursor:pointer;position:relative;overflow:hidden}
.scard:hover{transform:translateY(-4px);border-color:var(--sh2);box-shadow:0 16px 36px rgba(0,0,0,.4)}
.scard .ptag{position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor}
.scard .av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:'Space Grotesk';font-weight:600;font-size:16px;color:#10131f;margin-bottom:13px}
.scard .nm{font-weight:600;font-size:15.5px}.scard .mt{font-size:12px;color:var(--muted);margin-top:2px}
.scard .pl{font-size:11px;color:var(--muted-2);margin-top:10px}
.badge{font-size:10.5px;padding:3px 10px;border-radius:20px;font-weight:600;display:inline-block;margin-top:11px}
.b-ok{background:rgba(70,221,166,.16);color:var(--ok)}.b-warn{background:rgba(245,192,78,.16);color:var(--warn)}.b-bad{background:rgba(255,116,136,.16);color:var(--bad)}

.list{display:flex;flex-direction:column;gap:9px}
.li{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:15px;transition:.18s}
.li.clk{cursor:pointer}.li.clk:hover{border-color:var(--line-2);transform:translateX(3px)}
.li .av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:'Space Grotesk';font-weight:600;font-size:14px;color:#10131f;flex-shrink:0}
.li .nm{font-weight:600;font-size:14px}.li .mt{font-size:12px;color:var(--muted);margin-top:1px}
.li .right{margin-left:auto;display:flex;align-items:center;gap:16px}
.li .amt{font-family:'Space Grotesk';font-weight:600;font-size:15px}
.pd{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px currentColor;flex-shrink:0}
.einv{display:inline-flex;align-items:center;gap:7px;font-size:11px;padding:5px 11px;border-radius:9px;background:rgba(70,221,166,.12);border:1px solid rgba(70,221,166,.4);color:var(--ok);font-weight:600}
.einv svg{width:13px;height:13px;stroke:var(--ok);fill:none;stroke-width:2}

.dom{margin-bottom:16px}.dom:last-child{margin:0}
.dom .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px}
.dom .top .p{font-family:'Space Grotesk';color:var(--champ);font-weight:600}
.track{height:9px;background:rgba(255,255,255,.06);border-radius:8px;overflow:hidden}
.track i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--tk,var(--champ)),#ffffff66);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}

.log{display:grid;grid-template-columns:1fr 1.1fr;gap:18px}
.field{margin-bottom:18px}.field>label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:9px;font-weight:600}
.kidpick{display:flex;gap:11px;overflow-x:auto;padding-bottom:6px}
.kp{flex-shrink:0;text-align:center;cursor:pointer;opacity:.5;transition:.18s}.kp.on{opacity:1}
.kp .av{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-family:'Space Grotesk';font-weight:600;color:#10131f;margin:0 auto 5px;border:2px solid transparent}
.kp.on .av{border-color:var(--champ);box-shadow:0 0 0 3px var(--champ-soft)}
.kp .nm{font-size:11px;color:var(--muted)}.kp.on .nm{color:var(--txt)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);font-size:13px;color:var(--muted);transition:.16s;font-weight:500}
.chip.on{background:var(--champ);color:#1a1408;border-color:var(--champ);font-weight:600}
.chip:hover:not(.on){color:var(--txt);border-color:var(--line-2)}
.gen{width:100%;padding:15px;border-radius:15px;background:linear-gradient(135deg,var(--champ),var(--champ-2));color:#1a1408;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px;transition:.2s;box-shadow:0 10px 28px rgba(228,201,152,.3)}
.gen:hover{transform:translateY(-2px)}.gen:disabled{opacity:.65;cursor:wait;transform:none}
.gen svg{width:19px;height:19px;stroke:#1a1408;stroke-width:2;fill:none}
.report{background:var(--panel-2);border:1px solid var(--line);border-radius:17px;padding:22px;min-height:300px}
.report .empty{color:var(--muted-2);text-align:center;padding-top:90px;font-size:14px;line-height:1.8;white-space:pre-line}
.lb{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.06)}.lb:last-of-type{border:none}
.lb .lg{font-size:10.5px;letter-spacing:1.8px;color:var(--champ);text-transform:uppercase;font-weight:700;margin-bottom:7px}
.lb .tx{font-size:14px;line-height:1.8;color:#DCE5FB;min-height:22px}
.wa{margin-top:14px;width:100%;padding:13px;border-radius:14px;background:#25D366;color:#04331c;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px}
.wa svg{width:19px;height:19px;fill:#04331c}
.note{font-size:11px;color:var(--muted-2);margin-top:11px;text-align:center}

.tt{display:grid;grid-template-columns:54px repeat(5,1fr);gap:7px;font-size:12px}
.tt .h{color:var(--muted);font-weight:600;text-align:center;padding:8px 0}
.tt .t{color:var(--muted-2);text-align:right;padding-right:8px;align-self:center}
.tt .cell{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;min-height:48px}
.tt .cls{border-radius:11px;padding:8px;font-size:11px;border:1px solid}
.tt .cls b{display:block;font-weight:600;font-size:12px;margin-bottom:2px}.tt .cls span{color:var(--muted)}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.kcol{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:16px;padding:13px;min-height:200px}
.kcol .kh{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:12px;padding:0 3px}
.kcol .kh .ct{font-family:'Space Grotesk';font-size:12px;color:var(--muted);background:var(--panel-2);padding:2px 9px;border-radius:20px}
.lead{background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px;cursor:pointer;transition:.18s;position:relative}
.lead:hover{border-color:var(--lch);transform:translateY(-2px)}
.lead .nm{font-weight:600;font-size:13.5px}
.lead .src{font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;display:inline-block;margin-top:7px}
.lead .nx{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px}
.lead .dd{position:absolute;top:13px;right:13px;font-size:10px;color:var(--muted-2)}

/* charts */
.bars{display:flex;align-items:flex-end;gap:12px;height:150px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bcol .bk{display:flex;flex-direction:column-reverse;width:100%;height:100%;justify-content:flex-start;gap:2px}
.bseg{border-radius:5px 5px 0 0;transition:height .9s cubic-bezier(.2,.8,.2,1);height:0}
.bcol .lbl{font-size:11px;color:var(--muted)}
.donut{width:150px;height:150px;flex-shrink:0}
.legend{display:flex;flex-direction:column;gap:9px}
.legend .lg{display:flex;align-items:center;gap:9px;font-size:13px}
.legend .lg .d{width:11px;height:11px;border-radius:3px}
.legend .lg .v{margin-left:auto;font-family:'Space Grotesk';font-weight:600;color:var(--muted)}

/* attendance calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .cd{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:12px;font-family:'Space Grotesk';position:relative;background:var(--panel-2);border:1px solid var(--line)}
.cal .cd.p{background:rgba(70,221,166,.16);border-color:rgba(70,221,166,.35);color:var(--ok)}
.cal .cd.a{background:rgba(255,116,136,.14);border-color:rgba(255,116,136,.3);color:var(--bad)}
.cal .cd.l{background:rgba(245,192,78,.14);border-color:rgba(245,192,78,.3);color:var(--warn)}
.cal .cd.lv{background:rgba(120,140,200,.12);color:var(--muted)}
.cal .cd.x{background:transparent;border:none}
.cal .wd{text-align:center;font-size:11px;color:var(--muted-2);padding-bottom:4px}

/* integration / settings rows */
.intg{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.05)}

async function genReport(){const btn=document.getElementById('genBtn'),rep=document.getElementById('report'),fields=document.querySelectorAll('.field');
 const kid=window._kid||document.querySelector('#kidpick .kp.on .nm')?.textContent||'孩子';
 const meal=fields[1].querySelector('.chip.on')?.textContent||'用餐正常',mood=fields[2].querySelector('.chip.on')?.textContent||'😄 开心';
 const acts=[...document.querySelectorAll('#acts .chip.on')].map(c=>c.textContent);
 btn.disabled=true;btn.innerHTML=SPARK+'AI 撰写中…';
 const prog=actives().find(k=>['taska','tadika','after'].includes(k));const ptype=PROGRAMS[prog]?.label||'托儿所';
 const prompt=`你是马来西亚一家${ptype}的老师，根据今天的记录为家长写温暖具体简短（每语言2-3句）的今日日报，用中文、马来文(BM)、英文。语气亲切像真老师。只输出三段以「中文：」「BM：」「EN：」开头。\n记录：孩子=${kid}；用餐=${meal}；心情=${mood}；活动=${acts.join('、')||'日常活动'}`;
 let zh,ms,en,fb=false;
 try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
  const d=await r.json();const txt=d.content.filter(c=>c.type==='text').map(c=>c.text).join('\n');
  zh=(txt.match(/中文：([\s\S]*?)(?=BM：|$)/)||[])[1]?.trim();ms=(txt.match(/BM：([\s\S]*?)(?=EN：|$)/)||[])[1]?.trim();en=(txt.match(/EN：([\s\S]*?)$/)||[])[1]?.trim();if(!zh||!ms||!en)throw 0;
 }catch(e){fb=true;const A=acts.join('、')||'日常活动',aE=acts.join(', ')||'daily activities',m=mood.replace(/[^\u4e00-\u9fa5]/g,'')||'开心';
  zh=`今天${kid}在园表现很棒！${meal}，开心参与了${A}，整体心情${m}。我们会继续用心照顾，谢谢您的信任。`;ms=`Hari ini ${kid} sangat ceria! Makan dengan baik dan menyertai ${aE}. Terima kasih atas kepercayaan anda.`;en=`${kid} had a wonderful day! Ate well and joined ${aE}, cheerful throughout. Thank you for trusting us.`;}
 rep.innerHTML=[['中文 Mandarin',zh],['Bahasa Melayu',ms],['English',en]].map(b=>`<div class="lb"><div class="lg">${b[0]}</div><div class="tx" data-full="${b[1].replace(/"/g,'&quot;')}"></div></div>`).join('')+`<button class="wa">${WA()}通过 WhatsApp 发给家长</button>`+(fb?'<div class="note">示范模式 · 部署至 GitHub Pages 需接入 Anthropic API Key 实时生成</div>':'');
 const txs=[...rep.querySelectorAll('.tx')];let bi=0;(function ty(){if(bi>=txs.length){btn.disabled=false;btn.innerHTML=SPARK+'生成三语日报';return;}const el=txs[bi],f=el.dataset.full;let i=0;const iv=setInterval(()=>{el.textContent=f.slice(0,i++);if(i>f.length){clearInterval(iv);bi++;ty();}},11);})();}

/* drawer / studio */
function openDrawer(html){document.getElementById('drawerBody').innerHTML=html;document.getElementById('scrim').classList.add('show');document.getElementById('drawer').classList.add('show');}
function openStudio(){renderStudio();document.getElementById('scrim').classList.add('show');document.getElementById('studio').classList.add('show');}
function closeAll(){document.getElementById('scrim').classList.remove('show');document.getElementById('studio').classList.remove('show');document.getElementById('drawer').classList.remove('show');}
function renderStudio(){document.getElementById('stEyebrow').textContent='活化中心';document.getElementById('stTitle').textContent='开通你需要的项目';
 document.getElementById('stLede').textContent='从一个项目开始，随业务长大再开通更多。同一套系统、同一份数据、同一个登录——永不迁移。';
 document.getElementById('pcards').innerHTML=ORDER.map(k=>{const p=PROGRAMS[k];return `<div class="pcard ${p.active?'live':'dorm'}" style="--ph:${p.hue}"><div class="ph-row"><div class="ico"><svg viewBox="0 0 24 24">${IC[p.young?'daily':(p.sessions?'sessions':'attend')]}</svg></div><div><div class="nm">${p.label}</div><div class="sub">${p.sub}</div></div><div class="act">${p.active?`<button class="btn-off" onclick="toggleProg('${k}')">暂停</button>`:`<button class="btn-on" onclick="toggleProg('${k}')">开通</button>`}</div></div><div class="mods">${p.active?'<span class="livetag"><span class="d"></span>运行中</span> · ':''}<b>模块：</b>${p.mods.join(' · ')}</div></div>`;}).join('');}
function toggleProg(k){const p=PROGRAMS[k];if(p.active&&actives().length===1){toast('至少保留一个项目','',p.hue);return;}
 p.active=!p.active;if(p.active){VIEW='dash';toast(p.label+' · 已开通',p.mods.length+' 个模块已加入',p.hue);}else{if(!navMods().includes(VIEW))VIEW='dash';toast(p.label+' · 已暂停','',p.hue);}
 renderStudio();renderAll();}
function toast(title,sub,hue){const el=document.getElementById('toast');el.querySelector('.d').style.cssText=`background:${hue};color:${hue}`;document.getElementById('toastT').textContent=title;document.getElementById('toastS').textContent=sub;document.getElementById('toastS').style.display=sub?'block':'none';el.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove('show'),2600);}

renderAll();
</script>
